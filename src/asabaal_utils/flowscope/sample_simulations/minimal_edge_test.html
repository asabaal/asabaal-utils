<!DOCTYPE html>
<html>
<head>
    <title>Minimal Edge Test</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
    <div id="network" style="width: 300px; height: 200px; border: 1px solid #ccc;"></div>
    <div id="output"></div>
    
    <script>
        // Create nodes and edges exactly like the interactive calculator
        const nodes = new vis.DataSet([
            {id: 'a', label: 'Node A'},
            {id: 'b', label: 'Node B'}
        ]);
        
        const edges = new vis.DataSet([
            {from: 'a', to: 'b'}
        ]);
        
        const container = document.getElementById('network');
        const network = new vis.Network(container, {
            nodes: nodes,
            edges: edges
        }, {});
        
        function testEdgeData() {
            const positions = network.getPositions();
            const edgeList = edges.get();
            
            const output = document.getElementById('output');
            output.innerHTML = `
                <h3>Edge Data Test Results:</h3>
                <p><strong>Positions:</strong> ${JSON.stringify(positions, null, 2)}</p>
                <p><strong>EdgeList:</strong> ${JSON.stringify(edgeList, null, 2)}</p>
                <p><strong>EdgeList type:</strong> ${typeof edgeList}</p>
                <p><strong>EdgeList length:</strong> ${edgeList ? edgeList.length : 'undefined'}</p>
                <p><strong>Edges object:</strong> ${JSON.stringify(edges, null, 2)}</p>
                <p><strong>Network body data edges:</strong> ${JSON.stringify(network.body.data.edges, null, 2)}</p>
            `;
            
            // Test the updateEdgeInfoDisplay function directly
            if (edgeList && edgeList.length > 0) {
                console.log('Testing edge processing...');
                edgeList.forEach(edge => {
                    const pos1 = positions[edge.from];
                    const pos2 = positions[edge.to];
                    console.log('Edge:', edge);
                    console.log('Pos1:', pos1, 'Pos2:', pos2);
                    if (pos1 && pos2) {
                        const dx = pos2.x - pos1.x;
                        const dy = pos2.y - pos1.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        console.log('Distance:', distance);
                    }
                });
            } else {
                console.log('No edges to process!');
            }
        }
        
        // Test after network initializes
        setTimeout(testEdgeData, 1000);
    </script>
</body>
</html>
