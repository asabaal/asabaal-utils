<script>
// Module data storage
const moduleGraphs = {};
let currentNetwork = null;

// Initialize module graphs data

moduleGraphs['math_ops'] = {
    nodes: [{"id": "math_ops.add", "label": "add", "title": "math_ops.add\\nFile: flowscope/examples/example_v2/math_ops.py\\nLine: 1\\nModule: math_ops", "color": "#ffd700", "shape": "box", "font": {"size": 12, "color": "#333333"}}, {"id": "math_ops.subtract", "label": "subtract", "title": "math_ops.subtract\\nFile: flowscope/examples/example_v2/math_ops.py\\nLine: 4\\nModule: math_ops", "color": "#90ee90", "shape": "box", "font": {"size": 12, "color": "#333333"}}, {"id": "math_ops.calculator", "label": "calculator", "title": "math_ops.calculator\\nFile: flowscope/examples/example_v2/math_ops.py\\nLine: 10\\nModule: math_ops", "color": "#90ee90", "shape": "box", "font": {"size": 12, "color": "#333333"}}, {"id": "math_ops.multiply", "label": "multiply", "title": "math_ops.multiply\\nFile: flowscope/examples/example_v2/math_ops.py\\nLine: 7\\nModule: math_ops", "color": "#ffd700", "shape": "box", "font": {"size": 12, "color": "#333333"}}],
    edges: [{"from": "math_ops.calculator", "to": "math_ops.add", "title": "math_ops.calculator \u2192 math_ops.add", "arrows": "to", "color": {"color": "#666666", "highlight": "#ff0000"}}, {"from": "math_ops.calculator", "to": "math_ops.multiply", "title": "math_ops.calculator \u2192 math_ops.multiply", "arrows": "to", "color": {"color": "#666666", "highlight": "#ff0000"}}]
};

function loadSelectedModule() {
    const selectedModule = document.getElementById('module-dropdown').value;
    const container = document.getElementById('mynetwork');
    const infoDiv = document.getElementById('module-info');
    
    if (selectedModule === 'dependency-view') {
        // Load the original module dependency graph
        location.reload();
        return;
    }
    
    const moduleData = moduleGraphs[selectedModule];
    if (!moduleData) {
        infoDiv.innerHTML = '<span style="color: red;">Module data not found</span>';
        return;
    }
    
    // Update info
    const funcCount = moduleData.nodes.length;
    const callCount = moduleData.edges.length;
    infoDiv.innerHTML = `<strong>${selectedModule}</strong><br>${funcCount} functions, ${callCount} calls`;
    
    // Clear existing network
    if (currentNetwork) {
        currentNetwork.destroy();
    }
    
    // Create new network
    const nodes = new vis.DataSet(moduleData.nodes);
    const edges = new vis.DataSet(moduleData.edges);
    
    const data = { nodes: nodes, edges: edges };
    
    const options = {
        physics: {
            enabled: true,
            stabilization: {
                iterations: 100
            }
        },
        interaction: {
            hover: true,
            tooltipDelay: 200
        },
        layout: {
            improvedLayout: false
        },
        nodes: {
            borderWidth: 1,
            borderColor: '#666666',
            font: { color: '#333' }
        },
        edges: {
            smooth: {
                type: 'dynamic'
            }
        }
    };
    
    currentNetwork = new vis.Network(container, data, options);
    
    // Fit network to show all nodes
    currentNetwork.once('stabilized', function() {
        currentNetwork.fit({
            animation: {
                duration: 1000,
                easingFunction: 'easeInOutQuad'
            }
        });
    });
}

// Auto-load first module on page load
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
        const dropdown = document.getElementById('module-dropdown');
        if (dropdown && dropdown.options.length > 1) {
            dropdown.selectedIndex = 1; // Select first module (not dependency view)
            loadSelectedModule();
        }
    }, 1000);
});
</script>
