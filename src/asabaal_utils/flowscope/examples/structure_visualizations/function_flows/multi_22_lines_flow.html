                    id: node.id,
                    label: label,
                    title: `${node.label}\nType: ${node.type}\nLine: ${node.line}`,
                    color: {
                        background: color,
                        border: '#333'
                    },
                    shape: shape,
                    font: {size: 12, color: '#333'},
                    borderWidth: 2,
                    x: hierarchicalPositions[node.id]?.x || 0,
                    y: hierarchicalPositions[node.id]?.y || 0
                });
            }
        });
        
        // Create edges with appropriate styling
        const edges = new vis.DataSet(functionFlowData.edges.map(edge => ({
            from: edge.from,
            to: edge.to,
            label: edge.label || '',
            arrows: 'to',
            color: {color: '#666666', highlight: '#007bff'},
            width: 2,
            smooth: {
                type: 'cubicBezier',
                roundness: 0.1
            }
        })));
        
        // Create network with hierarchical layout
        const container = document.getElementById('network');
        const data = { nodes, edges };
        
        const options = {
            layout: {
                hierarchical: {
                    enabled: false,  // Use our manual positions
                    levelSeparation: 150,
                    nodeSpacing: 200,
                    treeSpacing: 200
                }
            },
            physics: {
                enabled: false,  // Start with physics disabled
                stabilization: {
                    enabled: true,
                    iterations: 100
                }
            },
            interaction: {
                hover: true,
                tooltipDelay: 200,
                dragNodes: true,
                dragView: true,
                zoomView: true
            },
            nodes: {
                borderWidth: 2,
                shadow: true
            },
            edges: {
                shadow: true,
                smooth: {
                    type: 'cubicBezier',
                    roundness: 0.2
                }
            }
        };
        
        const network = new vis.Network(container, data, options);
        
        // Fit to screen after network is ready
        network.once('stabilizationIterationsDone', function() {
            network.fit();
        });
        
        // Control functions
        function togglePhysics() {
            const physicsEnabled = !network.physics.physicsEnabled;
            network.setOptions({
                physics: {
                    enabled: physicsEnabled
                }
            });
        }
    </script>
</body>
</html>
