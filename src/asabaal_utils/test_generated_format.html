<!DOCTYPE html>
<html>
<head>
    <title>Test Generated JS</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
    <div id="network" style="height: 400px; border: 1px solid #ddd;"></div>
    
    <script type="text/javascript">
        // Test the exact format being generated
        var nodes = [
            {id: 'node_0', label: "Enter main", color: '#90ee90', shape: 'ellipse'},
            {id: 'node_1', label: "Exit main", color: '#ff6b6b', shape: 'ellipse'},
            {id: 'node_2', label: "prog=\"dmtc.stage1\"", title: "prog=\"dmtc.stage1\"\\nLine: 7\\nType: statement", color: '#97c2fc', shape: 'box', font: {size: 12}}
        ];
        
        var edges = [
            {from: 'node_0', to: 'node_2', label: "", arrows: 'to', color: {color: "#666666"}, font: {size: 10, align: "middle"}},
            {from: 'node_2', to: 'node_1', label: "", arrows: 'to', color: {color: "#666666"}, font: {size: 10, align: "middle"}}
        ];
        
        var container = document.getElementById('network');
        var data = {nodes: nodes, edges: edges};
        var options = {
            layout: {hierarchical: {direction: 'UD', sortMethod: 'directed'}},
            physics: {enabled: false}
        };
        
        var network = new vis.Network(container, data, options);
    </script>
