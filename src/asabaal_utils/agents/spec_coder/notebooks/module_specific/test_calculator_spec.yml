
name: test_calculator
version: 1.0.0
description: A simple calculator for testing CodeGenerator
requirements:
  - name: basic_arithmetic
    description: Support for basic arithmetic operations
    validation:
      type: functional
interfaces:
  - name: Calculator
    type: class
    methods:
      - name: add
        signature: "add(a: float, b: float) -> float"
      - name: subtract
        signature: "subtract(a: float, b: float) -> float"
