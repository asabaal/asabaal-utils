name: Deploy to GitHub Codespaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        
    - name: Create deployment package
      run: |
        mkdir -p deployment
        cp -r tools/ deployment/
        cp -r src/ deployment/
        cp requirements.txt deployment/
        cp pyproject.toml deployment/
        
        # Create startup script
        cat > deployment/start.sh << 'EOF'
        #!/bin/bash
        echo "🚀 Starting Claude Tool Bridge..."
        
        # Install dependencies
        pip install -r requirements.txt
        pip install -e .
        
        # Start services
        cd tools
        python converter_api.py &
        python claude_tool_bridge.py
        EOF
        
        chmod +x deployment/start.sh
        
    - name: Deploy to GitHub Pages (Static Demo)
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./deployment
        
    - name: Create Codespace Config
      run: |
        mkdir -p .devcontainer
        cat > .devcontainer/devcontainer.json << 'EOF'
        {
          "name": "Claude Tool Bridge",
          "image": "mcr.microsoft.com/devcontainers/python:3.11",
          "features": {
            "ghcr.io/devcontainers/features/git:1": {},
            "ghcr.io/devcontainers/features/github-cli:1": {}
          },
          "forwardPorts": [7000, 8000],
          "portsAttributes": {
            "7000": {
              "label": "Claude Bridge",
              "onAutoForward": "notify"
            },
            "8000": {
              "label": "Converter API", 
              "onAutoForward": "notify"
            }
          },
          "postCreateCommand": "pip install -r requirements.txt && pip install -e .",
          "postStartCommand": "cd tools && python converter_api.py & python claude_tool_bridge.py",
          "customizations": {
            "vscode": {
              "extensions": [
                "ms-python.python",
                "ms-python.flake8"
              ]
            }
          }
        }
        EOF
        
    - name: Commit Codespace Config
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .devcontainer/
        git diff --staged --quiet || git commit -m "Add Codespace configuration"
        git push