[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asabaal_utils"
version = "0.0.1"
authors = [{name = "Asabaal Horan", email = "asabaal@asabaalventures.org"}]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.26.0",
    "moviepy>=1.0.3",
    "numpy>=1.21.0",
    "librosa>=0.9.2",
    "scikit-learn>=1.0.2",
    "scikit-image>=0.19.0",
    "tqdm>=4.62.3",
    "pillow>=9.0.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    # Lyric video dependencies
    "opencv-python>=4.8.0",
    "pydub>=0.25.1",
    "imageio>=2.31.0",
    "imageio-ffmpeg>=0.4.8",
    "ffmpeg-python>=0.2.0",
    "click>=8.1.0",
    "rich>=13.5.0",
    "pyyaml>=6.0",
    "jsonschema>=4.19.0",
    # Additional dependencies found in codebase
    "pathspec>=0.11.0",
    "gitpython>=3.1.0", 
    "dataclasses-json>=0.6.0",
    "yt-dlp>=2023.7.6",
    "beautifulsoup4>=4.12.0",
    "reportlab>=4.0.0",
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "pandas>=1.5.0",
    "seaborn>=0.12.0",
    "pytesseract>=0.3.10",
    "joblib>=1.3.0"
]

[project.urls]
"Homepage" = "https://github.com/asabaal/asabaal-utils"
"Bug Tracker" = "https://github.com/asabaal/asabaal-utils/issues"

[project.scripts]
remove-silence = "asabaal_utils.video_processing.cli:remove_silence_cli"
analyze-transcript = "asabaal_utils.video_processing.cli:analyze_transcript_cli"
generate-thumbnails = "asabaal_utils.video_processing.cli:generate_thumbnails_cli"
analyze-colors = "asabaal_utils.video_processing.cli:analyze_colors_cli"
detect-jump-cuts = "asabaal_utils.video_processing.cli:detect_jump_cuts_cli"
create-summary = "asabaal_utils.video_processing.cli:create_summary_cli"
extract-clips = "asabaal_utils.video_processing.cli:extract_clips_cli"
capcut-timeline = "asabaal_utils.video_processing.cli:capcut_timeline_cli"
detect-unused-media = "asabaal_utils.video_processing.cli:detect_unused_media_cli"
find-unused-media = "asabaal_utils.video_processing.cli:find_unused_media_cli"
analyze-project = "asabaal_utils.video_processing.cli:analyze_project_structure_cli"
create-lyric-video = "asabaal_utils.video_processing.lyric_video_cli:create_lyric_video_cli"
gradient-blend = "asabaal_utils.image_processing.gradient_blend:main"
ocr = "asabaal_utils.image_processing.ocr_cli:main"
image-generator = "asabaal_utils.image_processing.image_generator:main"
auto-layout = "asabaal_utils.image_processing.auto_layout:main"
blended-layout = "asabaal_utils.image_processing.blended_layout_generator:main"
test-frame-extractor = "asabaal_utils.video_processing.test_frame_extractor:main"
analyze-structure = "asabaal_utils.audio_analysis.cli:analyze_structure_cli"
pr-analyzer = "asabaal_utils.pr_analyzer.cli:main"
detect-duplicates = "asabaal_utils.video_processing.duplicate_detection:main"
take-ranker = "asabaal_utils.video_processing.duplicate_detection:main"
transcript-combiner = "asabaal_utils.video_processing.transcript_combiner:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}